[project]
name = "pymc-modeling"
version = "0.1.0"
description = "Bayesian statistical modeling with PyMC, focused on hierarchical models and COVID-19 variant analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "polars>=1.0.0",
    "pymc>=5.20.0",
    "arviz>=0.20.0",
    "pytensor>=2.18.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "scipy>=1.10.0",
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipython>=8.12.0",
    "notebook>=7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
